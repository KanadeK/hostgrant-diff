[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hostgrant-diff"
version = "0.1.0"
description = "Semantic HTTP, HTTPS and file host-grant changes between Chrome MV3 manifests."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
hostgrant-diff = "hostgrant_diff.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/hostgrant-diff"
Issues = "https://github.com/KanadeK/hostgrant-diff/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["hostgrant_diff"]
branch = true

[tool.coverage.report]
show_missing = true
